roll de una mesa de", "ang": "Gift Giving", "hook": "\"Cuando mi viejo cumplió ochenta entendí que las sobremesas que me quedaban con él se contaban con los dedos.\"", "dur": "68.8", "title": "RR_S41_CBO6_G85_H1"}, {"file": "S41_RR_B28.mp4", "brand": "RR", "g": "G86", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Cinemático de producto en clave oscura, cartelas rojas, el producto en mano", "ang": "Cuál es tu puro", "hook": "\"Tres vitolas. Una es la tuya.\"", "dur": "24.7", "title": "RR_S41_CBO6_G86_H1"}, {"file": "S41_RR_B12.mp4", "brand": "RR", "g": "G87", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Review de valor: packaging en detalle, el objeto a la luz, remate de valor sin", "ang": "Pagás la etiqueta → por qué vale cada peso", "hook": "\"Por qué esta caja vale cada peso que pagué, empezando por lo que viste primero.\"", "dur": "30.0", "title": "RR_S41_CBO6_G87_H1"}, {"file": "S41_RR_B29.mp4", "brand": "RR", "g": "G88", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Unboxing b-roll sin voz, un solo set, movimientos lentos, subtítulo chico de", "ang": "Más allá del puro", "hook": "\"Unboxing · caja de 10 Ramón Ramírez\"", "dur": "48.5", "title": "RR_S41_CBO6_G88_H1"}, {"file": "S41_RR_B13.mp4", "brand": "RR", "g": "G89", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Humor contra el snob: escenas IA exageradas del «fumador de manual»", "ang": "Argentinidad y provocación", "hook": "\"Para disfrutar un puro no necesitás un chaleco, un humidor de dos metros ni saber decir «tiro» en tres idiomas.\" HOOK 2:", "dur": "39.9", "title": "RR_S41_CBO6_G89_H1"}, {"file": "S41_RR_B30.mp4", "brand": "RR", "g": "G90", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Vendedor detrás del mostrador hablando rápido con el producto en mano, 3", "ang": "Argentinidad y provocación", "hook": "\"Dejá de perseguir cubanos que no llegan nunca.\"", "dur": "26.3", "title": "RR_S41_CBO6_G90_H1"}, {"file": "S41_RR_B14.mp4", "brand": "RR", "g": "G91", "day": "SÁBADO", "fmt": "COPIAR TAL CUAL · Empacando un ped o adentro? Parecen iguales. No lo son.\"", "dur": "28.7", "title": "RR_S41_CBO6_G96_H1"}];const M={DR:"Dr. Rozenberg",LL:"Lagos Lab",RR:"Ramón Ramírez"};
const m=document.getElementById('m');let muted=true,seqOn=false,filt='TODO';
const days=[...new Set(R.map(r=>r.day))];
days.forEach(d=>{const s=document.createElement('section');s.dataset.day=d;const rs=R.filter(r=>r.day==d);
s.innerHTML=`<h2>${d} · ${M[rs[0].brand]} (${rs.length})</h2><div class="grid"></div>`;
const g=s.querySelector('.grid');rs.forEach(r=>{const c=document.createElement('div');c.className='c';c.dataset.brand=r.brand;
c.innerHTML=`<video controls playsinline muted preload="none" data-src="${r.file}#t=0.5"></video><div class="i"><div class="t">${r.g} <span>${r.brand} · ${r.dur}s</span></div><div class="a">${r.ang}</div><div class="f">${r.fmt}</div><div class="h">${r.hook}</div><div class="f">${r.file}</div></div>`;g.appendChild(c)});m.appendChild(s)});
const vids=[...document.querySelectorAll('video')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const v=e.target;if(!v.src){v.src=v.dataset.src;v.preload='metadata'}io.unobserve(v)}}),{rootMargin:'600px'});
vids.forEach(v=>{io.observe(v);v.addEventListener('play',()=>v.closest('.c').classList.add('playing'));
v.addEventListener('pause',()=>v.closest('.c').classList.remove('playing'));
v.addEventListener('ended',()=>{v.closest('.c').classList.remove('playing');if(seqOn){const vis=visible();const n=vis[vis.indexOf(v)+1];if(n){load(n);n.muted=muted;n.scrollIntoView({behavior:'smooth',block:'center'});n.play()}}})});
const load=v=>{if(!v.src){v.src=v.dataset.src}};
const visible=()=>vids.filter(v=>!v.closest('.hidden'));
playAll.onclick=()=>{seqOn=false;seq.classList.remove('on');visible().forEach(v=>{load(v);v.muted=muted;v.play().catch(()=>{})})};
pauseAll.onclick=()=>vids.forEach(v=>v.pause());
mute.onclick=()=>{muted=!muted;mute.classList.toggle('on',muted);mute.textContent=muted?'🔇 Mudas':'🔊 Con sonido';vids.forEach(v=>v.muted=muted)};
seq.onclick=()=>{seqOn=!seqOn;seq.classList.toggle('on',seqOn);if(seqOn){vids.forEach(v=>v.pause());const v=visible()[0];load(v);v.muted=muted;v.scrollIntoView({behavior:'smooth',block:'center'});v.play()}};
const F=document.getElementById('filters');['TODO','DR','LL','RR',...days].forEach(k=>{const b=document.createElement('button');b.textContent=M[k]||(k=='TODO'?'Todo':k[0]+k.slice(1).toLowerCase());if(k==filt)b.classList.add('on');
b.onclick=()=>{filt=k;F.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));vids.forEach(v=>v.pause());
document.querySelectorAll('section').forEach(s=>{const rs=s.querySelector('.c').dataset.brand;s.classList.toggle('hidden',!(k=='TODO'||k==rs||k==s.dataset.day))})};F.appendChild(b)});
</script></body></html>
